[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mask_generator"
version = "0.1.0"
description = "Camera-image to line-mask CNN + 2D raycast for the Robocar project"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andreea Brenda Rauta" }]

dependencies = [
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "segmentation-models-pytorch>=0.3",
    "pyyaml>=6.0",
    "albumentations>=1.4",
]

[project.optional-dependencies]
train = ["tqdm>=4.66", "scikit-learn>=1.3", "tensorboard>=2.16", "pandas>=2.0", "matplotlib>=3.7"]
notebook = ["jupyter>=1.0", "ipykernel>=6.25"]
deploy = ["onnx>=1.15", "onnxruntime>=1.17"]
all = [
    "tqdm>=4.66", "scikit-learn>=1.3", "tensorboard>=2.16", "pandas>=2.0", "matplotlib>=3.7",
    "jupyter>=1.0", "ipykernel>=6.25",
    "onnx>=1.15", "onnxruntime>=1.17",
]

[project.scripts]
mask-generator-prepare = "src.dataset.prepare:main"
mask-generator-train = "src.model.train:main"
mask-generator-quantize = "src.model.quantize:main"

[tool.setuptools]
packages = [
    "src",
    "src.dataset",
    "src.model",
    "src.raycast",
]
